<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0812">
  <title>THEONOE — SOU Studio</title>
  <style>
    :root { color-scheme: dark; --ink: #f4eff6; --muted: #9f97a8; --gold: #e0c47e; --line: rgba(224,196,126,.24); }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body { display: grid; place-items: center; padding: 28px; color: var(--ink); background: radial-gradient(circle at 50% 34%, #24182e 0, #100b18 40%, #08060d 78%); font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    main { width: min(560px, 100%); text-align: center; }
    .icon { width: 120px; height: 120px; margin: 0 auto 34px; border-radius: 28px; box-shadow: 0 22px 70px rgba(0,0,0,.44), 0 0 50px rgba(224,196,126,.13); }
    .studio { margin: 0 0 14px; color: var(--gold); font-size: 11px; font-weight: 700; letter-spacing: .25em; text-transform: uppercase; }
    h1 { margin: 0; font-family: Georgia, 'Times New Roman', serif; font-size: clamp(48px, 13vw, 74px); font-weight: 400; letter-spacing: .08em; }
    .meta { margin: 22px auto 0; padding-top: 22px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; letter-spacing: .08em; }
  </style>
</head>
<body>
  <main>
    <img class="icon" src="./theonoe-wallet-identity.png" alt="THEONOE app icon" width="120" height="120">
    <p class="studio">SOU Studio presents</p>
    <h1>THEONOE</h1>
    <p class="meta">Solana Seeker · Mobile dApp</p>
  </main>
</body>
</html>
