<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0812">
  <title>SOU Studio</title>
  <style>
    :root { color-scheme: dark; --ink: #f2edf7; --muted: #9991a4; --gold: #dec17d; --line: rgba(222,193,125,.22); }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body { display: grid; place-items: center; padding: 32px; color: var(--ink); background: radial-gradient(circle at 50% 30%, #21172c 0, #100b18 38%, #08060d 78%); font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    main { width: min(720px, 100%); padding: clamp(36px, 8vw, 76px); border: 1px solid var(--line); border-radius: 32px; background: linear-gradient(145deg, rgba(255,255,255,.035), rgba(255,255,255,.01)); box-shadow: 0 42px 120px rgba(0,0,0,.45); }
    .mark { width: 18px; height: 18px; margin-bottom: 48px; transform: rotate(45deg); border: 1px solid var(--gold); box-shadow: 0 0 26px rgba(222,193,125,.38); }
    p { margin: 0 0 14px; color: var(--gold); font-size: 12px; font-weight: 700; letter-spacing: .24em; text-transform: uppercase; }
    h1 { margin: 0; font-family: Georgia, 'Times New Roman', serif; font-size: clamp(56px, 11vw, 104px); font-weight: 400; line-height: .92; letter-spacing: -.055em; }
    footer { margin-top: 56px; padding-top: 20px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; letter-spacing: .06em; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true"></div>
    <p>Independent game studio</p>
    <h1>SOU<br>Studio</h1>
    <footer>Interactive worlds, made with intent.</footer>
  </main>
</body>
</html>
